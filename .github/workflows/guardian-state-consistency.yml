name: Guardian state consistency

on:
  push:
    branches:
      - main
      - refactor/guardian-research-runner-v1
  pull_request:

jobs:
  state-consistency:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile deterministic Python tooling
        run: >-
          python -m py_compile
          research/runner/state_tools.py
          research/runner/experiment.py
          research/runner/runner.py
          research/runner/tester.py
          research/runner/batch.py
          research/runner/campaign.py
          research/runner/score.py
          research/runner/rich_score.py
          research/runner/publisher.py
          research/runner/result_transport.py
          research/runner/guardian_research.py
          research/runner/bootstrap_windows.py
          research/runner/source_hash.py
          research/runner/trade_path_validate.py
          research/runner/test_state_tools.py
          research/runner/test_runner_contract.py
          research/runner/test_trade_path_validate.py
          research/runner/test_rich_trade_path.py
          research/runner/test_campaign_transport.py

      - name: Parse Windows PowerShell tools
        shell: pwsh
        run: |
          $files = @(
            'research/runner/Run-GuardianResearch.ps1',
            'research/runner/Inspect-LegacyResultTransport.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error ("${file}: " + $_.Message) }
              exit 1
            }
          }

      - name: Validate authoritative state and generated views
        run: python research/runner/state_tools.py validate

      - name: Validate active D040 experiment contract
        run: python research/runner/experiment.py validate D040

      - name: Verify active D040 source is execution-ready
        run: python research/runner/experiment.py ready D040

      - name: Exercise active D040 runner planning without MT5
        run: python research/runner/guardian_research.py plan D040

      - name: Validate closed D039 manifest remains coherent
        run: python research/runner/experiment.py validate D039

      - name: Validate closed D038 manifest remains coherent
        run: python research/runner/experiment.py validate D038

      - name: Report D037 v1.02 historical source identity
        run: python research/runner/source_hash.py research/strategies/d037/D037_Williams_M15_v1_02.mq5

      - name: Report D038 v1.00 closed source identity
        run: python research/runner/source_hash.py research/strategies/d038/D038_NR7_TickPath_M15_v1_00.mq5

      - name: Report D039 v1.00 closed source identity
        run: python research/runner/source_hash.py research/strategies/d039/D039_InsideDay_TickPath_M15_v1_00.mq5

      - name: Report D040 v1.00 active source identity
        run: python research/runner/source_hash.py research/strategies/d040/D040_NR4_TickPath_M15_v1_00.mq5

      - name: Run regression tests
        run: |
          python research/runner/test_state_tools.py
          python research/runner/test_runner_contract.py
          python research/runner/test_trade_path_validate.py
          python research/runner/test_rich_trade_path.py
          python research/runner/test_campaign_transport.py
