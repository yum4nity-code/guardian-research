name: Guardian state consistency

on:
  push:
    branches:
      - main
      - refactor/guardian-research-runner-v1
  pull_request:

jobs:
  state-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile deterministic Python tooling
        run: python -m py_compile research/runner/state_tools.py research/runner/experiment.py research/runner/runner.py research/runner/test_state_tools.py

      - name: Validate authoritative state and generated views
        run: python research/runner/state_tools.py validate

      - name: Validate active experiment contract
        run: python research/runner/experiment.py validate D037

      - name: Exercise runner planning without MT5
        run: python research/runner/runner.py plan D037

      - name: Run state regression tests
        run: python research/runner/test_state_tools.py
