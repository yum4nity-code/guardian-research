name: Guardian state consistency

on:
  push:
    branches:
      - main
      - refactor/guardian-research-runner-v1
  pull_request:

jobs:
  state-consistency:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile deterministic Python tooling
        run: >-
          python -m py_compile
          research/runner/state_tools.py
          research/runner/experiment.py
          research/runner/runner.py
          research/runner/tester.py
          research/runner/batch.py
          research/runner/campaign.py
          research/runner/score.py
          research/runner/rich_score.py
          research/runner/rich_score_v2.py
          research/runner/publisher.py
          research/runner/result_transport.py
          research/runner/guardian_research.py
          research/runner/bootstrap_windows.py
          research/runner/source_hash.py
          research/runner/trade_path_validate.py
          research/runner/paired_management_score.py
          research/runner/d041_management_workflow.py
          research/runner/d046_expiry_score.py
          research/runner/d046_expiry_workflow.py
          research/runner/d051_nr7_index_confirmation.py
          research/runner/d052_management_alpha_workflow.py
          research/runner/d052_management_alpha_run.py
          research/runner/d053_orb30_index_workflow.py
          research/runner/d053_orb30_index_run.py
          research/runner/d053_orb30_deep_audit.py
          research/runner/d054_orb30_core3_workflow.py
          research/runner/d054_orb30_core3_run.py
          research/runner/management_benchmark.py
          research/runner/management_benchmark_offline.py
          research/runner/management_benchmark_v2.py
          research/runner/management_benchmark_v2_offline.py
          research/runner/market_transport_lab_v1.py
          research/runner/test_state_tools.py
          research/runner/test_runner_contract.py
          research/runner/test_trade_path_validate.py
          research/runner/test_rich_trade_path.py
          research/runner/test_campaign_transport.py
          research/runner/test_confirmation_rich_v2.py
          research/runner/test_paired_management_score.py
          research/runner/test_d046_expiry_score.py
          research/runner/test_management_benchmark.py
          research/runner/test_management_benchmark_v2.py
          research/runner/test_market_transport_lab_v1.py
          research/runner/test_d052_management_alpha.py
          research/runner/test_d053_orb30_index.py
          research/runner/test_d054_orb30_core3.py

      - name: Parse Windows PowerShell tools
        shell: pwsh
        run: |
          $files = @(
            'research/runner/Run-GuardianResearch.ps1',
            'research/runner/Inspect-LegacyResultTransport.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error ("${file}: " + $_.Message) }
              exit 1
            }
          }

      - name: Validate authoritative state and generated views
        run: python research/runner/state_tools.py validate

      - name: Validate active D054 experiment contract
        run: |
          python research/runner/experiment.py validate D054
          python research/runner/experiment.py ready D054

      - name: Verify active D054 exact-source identity and runner plan
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'research/runner')
          import runner
          import d054_orb30_core3_workflow as d054
          identities = d054.verify_frozen_repository_identity()
          report = runner.plan('D054')
          assert report['source_ready'], report['blockers']
          assert report['experiment_id'] == 'D054-ORB30-CORE3-JUL-AUG2026-CONFIRMATION-V0'
          assert report['execution']['symbols'] == ['SPX500', 'NDX100', 'US30']
          assert identities['source_sha256'] == 'd39182cc7bd0376322fee474ec7c321b9e1f5d4db93cdb6ff301f0fb60aba7ad'
          print('D054_SOURCE_READY_EXACT_D053_V101', report['source_identity'])
          PY

      - name: Validate closed experiment manifests remain coherent
        run: |
          python research/runner/experiment.py validate D053
          python research/runner/experiment.py validate D052
          python research/runner/experiment.py validate D046
          python research/runner/experiment.py validate D045
          python research/runner/experiment.py validate D044
          python research/runner/experiment.py validate D041
          python research/runner/experiment.py validate D040
          python research/runner/experiment.py validate D039
          python research/runner/experiment.py validate D038

      - name: Report frozen source identities
        run: |
          python research/runner/source_hash.py research/strategies/d037/D037_Williams_M15_v1_02.mq5
          python research/runner/source_hash.py research/strategies/d038/D038_NR7_TickPath_M15_v1_00.mq5
          python research/runner/source_hash.py research/strategies/d039/D039_InsideDay_TickPath_M15_v1_00.mq5
          python research/runner/source_hash.py research/strategies/d040/D040_NR4_TickPath_M15_v1_00.mq5
          python research/runner/source_hash.py research/strategies/d044/D044_TurtleSoup20D_H24_TickPath_M15_v1_00.mq5
          python research/runner/source_hash.py research/strategies/d045/D045_D1_Donchian20_10_TickPath_M15_v1_00.mq5
          python research/runner/source_hash.py research/strategies/d041/D041_D032_M2_DojiManagementValidation_v1_00.mq5
          python research/runner/source_hash.py research/strategies/d046/D046_BTC_DeribitExpiryReversal_M1_v1_00.mq5
          python research/runner/source_hash.py research/strategies/d052/D052_ManagementAsAlpha_PairedNull_M15_v1_00.mq5
          python research/runner/source_hash.py research/strategies/d053/D053_USIndex_ORB30_Tick_M15_v1_00.mq5

      - name: Run regression tests
        run: |
          python research/runner/test_state_tools.py
          python research/runner/test_runner_contract.py
          python research/runner/test_trade_path_validate.py
          python research/runner/test_rich_trade_path.py
          python research/runner/test_campaign_transport.py
          python research/runner/test_confirmation_rich_v2.py
          python research/runner/test_paired_management_score.py
          python research/runner/test_d046_expiry_score.py
          python research/runner/test_management_benchmark.py
          python research/runner/test_management_benchmark_v2.py
          python research/runner/test_market_transport_lab_v1.py
          python research/runner/test_d052_management_alpha.py
          python research/runner/test_d053_orb30_index.py
          python research/runner/test_d054_orb30_core3.py
